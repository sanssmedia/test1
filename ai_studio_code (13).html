<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mau Gak Jadi Pacarku? ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        .gif-container img {
            width: 150px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: #d81b60;
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            position: relative;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #btn-yes {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 4px 10px rgba(255, 64, 129, 0.3);
        }

        #btn-yes:hover {
            background-color: #e91e63;
            transform: scale(1.05);
        }

        #btn-no {
            background-color: #e0e0e0;
            color: #555;
            position: relative;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="gif-container">
            <!-- Kamu bisa ganti link GIF di bawah ini -->
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIyb2xidmVlNHNmdHN6OHc3cjhia2pzaHRlMmsxd25xbDF3cWp1ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Cat">
        </div>
        <h1>Mau gak jadi pacarku? 🥺❤️</h1>
        <p>Jawab yang jujur ya, jangan bohong!</p>
        
        <div class="btn-container">
            <button id="btn-yes" onclick="kirimWA()">Mau 🥰</button>
            <button id="btn-no" onmouseover="kabur()" onclick="kabur()">Gak 😝</button>
        </div>
    </div>

    <script>
        // ==========================================
        // PENGATURAN NOMOR WA DAN PESAN
        // ==========================================
        // Ganti nomor di bawah ini! Format: 628xxxxxxxx (jangan pakai 08 atau +)
        const NOMOR_WA = "6281234567890"; 
        
        // Pesan otomatis yang akan terkirim
        const PESAN = "Iya, aku mau jadi pacar kamu! ❤️🥰"; 

        function kirimWA() {
            // Encode pesan agar format spasi dan emoji terbaca di URL
            const url = `https://wa.me/${NOMOR_WA}?text=${encodeURIComponent(PESAN)}`;
            window.location.href = url;
        }

        // Fungsi agar tombol "Gak" kabur saat disentuh / didekati mouse
        function kabur() {
            const btnNo = document.getElementById('btn-no');
            
            // Dapatkan ukuran layar browser
            const maxX = window.innerWidth - btnNo.offsetWidth;
            const maxY = window.innerHeight - btnNo.offsetHeight;

            // Buat posisi acak baru
            const randomX = Math.floor(Math.random() * (maxX - 20)) + 10;
            const randomY = Math.floor(Math.random() * (maxY - 20)) + 10;

            btnNo.style.position = 'fixed';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        // Tambahan agar di HP (layar sentuh) tombolnya kabur saat disentuh
        document.getElementById('btn-no').addEventListener('touchstart', function(e) {
            e.preventDefault(); // Mencegah klik tertekan di HP
            kabur();
        });
    </script>
</body>
</html>
